<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SportsGovernor</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0B1220;color:#E2E8F0;padding-bottom:90px}
a{color:inherit;text-decoration:none}
/* HEADER - sticky, NOT fixed, so NO gap */
.topbar{position:sticky;top:0;z-index:50;height:58px;background:#020617;border-bottom:1px solid #1E293B;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{font-size:21px;font-weight:900;color:#fff}.logo span{color:#22C55E}.logo em{color:#EAB308;font-style:normal}
.live-badge{background:#DC2626;color:#fff;font-size:11px;font-weight:800;padding:6px 10px;border-radius:99px}
/* LAYOUT - normal flow, no margin-top, no 100vh tricks */
.main{width:100%}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;padding:9px 16px;border-radius:99px;background:#1E293B;border:1px solid #334155;font-size:14px;font-weight:600;flex-shrink:0}
.tab.active{background:#22C55E;color:#000;border-color:#22C55E}
/* CARDS */
.card{background:#1E293B;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px;display:block}
.card.selected{border-color:#22C55E}
.check{width:22px;height:22px;accent-color:#22C55E;margin-bottom:8px}
.league{font-size:11px;color:#94A3B8;text-transform:uppercase}
.teams{font-weight:700;font-size:17px;margin:6px 0}
.odds{display:flex;gap:8px;margin-top:12px}
.odd{flex:1;background:#0F172A;border:1px solid #334155;border-radius:10px;padding:10px;text-align:center}
.odd b{display:block;color:#22C55E;font-size:16px;margin-top:2px}.odd small{font-size:11px;color:#94A3B8}
table{width:100%;border-collapse:collapse;background:#1E293B;border-radius:16px;overflow:hidden}
th,td{padding:12px;text-align:left;border-bottom:1px solid #334155;font-size:14px}th{background:#020617}.win{color:#22C55E;font-weight:800}
/* GENERATE BAR - sticky at bottom of FORM, not fixed over everything */
.stickybar{position:sticky;bottom:78px;z-index:40;background:#020617;border:1px solid #334155;border-radius:16px;padding:12px;display:flex;gap:10px;margin-top:16px}
.stickybar input{flex:1;background:#1E293B;border:1px solid #334155;color:#fff;padding:13px;border-radius:12px;font-size:16px;min-width:0}
.btn{background:#22C55E;color:#000;border:none;padding:13px 18px;border-radius:12px;font-weight:900;font-size:15px;white-space:nowrap}
.btn:disabled{background:#334155;color:#94A3B8}
/* BOTTOM NAV - only fixed thing left, with proper spacing */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#020617;border-top:1px solid #1E293B;display:flex;z-index:60}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:#94A3B8}
.bnav-item.active{color:#22C55E}
.bnav-item .ico{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.center-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center}
.center-btn{width:52px;height:52px;background:#22C55E;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;border:4px solid #0B1220}
/* SIDEBAR DESKTOP */
.sidebar{display:none}
@media(min-width:900px){
  body{padding-bottom:0}
  .layout{display:flex}
  .sidebar{display:block;width:260px;flex-shrink:0;background:#020617;border-right:1px solid #1E293B;padding:20px 12px;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto}
  .sidebar h4{font-size:11px;color:#64748B;letter-spacing:1px;text-transform:uppercase;margin:18px 10px 8px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;font-size:15px;font-weight:600;color:#CBD5E1}
  .nav-item.active{background:#14532D;color:#fff}
  .nav-item .ico{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .bottom-nav{display:none}
  .stickybar{bottom:0}
  .main, .content {
  padding-bottom: 120px !important;
}
}
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="logo">SPORTS<span>GOVERNOR</span><em>™</em></a>
  <div class="live-badge">LIVE</div>
</div>

<div class="layout">
  <aside class="sidebar">
    <h4>Menu</h4>
    <a href="/" class="nav-item active"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 2 L22 12 V22 H2 V12 Z" fill="#E2E8F0"/></svg></span> Home</a>
    <a href="#" class="nav-item"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#E2E8F0" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="#DC2626"/></svg></span> Live Scores</a>
    <a href="/" class="nav-item"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="#E2E8F0" stroke-width="2"/><rect x="3" y="5" width="18" height="5" fill="#E2E8F0"/></svg></span> Today's Matches</a>
    <a href="#" class="nav-item"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24"><circle cx="8" cy="8" r="4" fill="#E2E8F0"/><circle cx="17" cy="8" r="3" fill="#E2E8F0"/><path d="M2 20 C2 16 5 14 8 14 C11 14 14 16 14 20 Z" fill="#E2E8F0"/><path d="M14 20 C14 16 16 15 18 15 C20 15 22 17 22 20 Z" fill="#94A3B8"/></svg></span> Teams</a>
    <a href="/" class="nav-item"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="#22C55E" stroke-width="2"/><rect x="8" y="7" width="8" height="2" fill="#22C55E"/><rect x="8" y="11" width="8" height="2" fill="#22C55E"/><rect x="8" y="15" width="8" height="2" fill="#22C55E"/></svg></span> Calculator</a>
  </aside>

  <main class="main">
    <div class="wrap">
      
      {% block content %}{% endblock %}
    </div>
    {% block bottom %}{% endblock %}
  </main>
</div>

<nav class="bottom-nav">
  <a href="/" class="bnav-item active"><span class="ico"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2 L22 12 V22 H2 V12 Z" fill="#22C55E"/></svg></span>Home</a>
  <a href="#" class="bnav-item"><span class="ico"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#94A3B8" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="#94A3B8"/></svg></span>Live</a>
  <a href="/" class="bnav-item"><span class="center-wrap"><span class="center-btn"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2" fill="none" stroke="#000" stroke-width="2"/><rect x="8" y="7" width="8" height="2" fill="#000"/><rect x="8" y="11" width="8" height="2" fill="#000"/><rect x="8" y="15" width="8" height="2" fill="#000"/></svg></span></span>Calc</a>
  <a href="#" class="bnav-item"><span class="ico"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6 3 H18 V9 C18 13 15 16 12 16 C9 16 6 13 6 9 Z" fill="#94A3B8"/><rect x="11" y="16" width="2" height="4" fill="#94A3B8"/><rect x="8" y="20" width="8" height="2" fill="#94A3B8"/></svg></span>Tables</a>
  <a href="#" class="bnav-item"><span class="ico"><svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#94A3B8"/><path d="M4 20 C4 16 7 14 12 14 C17 14 20 16 20 20 Z" fill="#94A3B8"/></svg></span>Profile</a>
</nav>
</body>
</html>
